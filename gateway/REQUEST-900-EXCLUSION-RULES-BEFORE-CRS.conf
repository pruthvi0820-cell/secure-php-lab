# G2: WAF tuning. Each exclusion is as narrow as possible: one page, one field, one attack type.
# Rule IDs 1000-1999 are reserved for our own rules.

# Passwords are never put into SQL or HTML: they are only hashed with bcrypt.
# Inspecting them only blocks real users who choose strong passwords with symbols.
SecRule REQUEST_FILENAME "@rx ^/(?:login|register)\.php$" \
    "id:1000,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:confirm"

# The contact message is free text. Recruiters may write about SQL, XSS or file paths.
# It is safe because the app saves it with a prepared statement and shows it with htmlspecialchars().
# Only the SQLi, XSS and LFI checks are relaxed, only for this field, only on this page.
# Every other field, and the RCE / PHP-injection checks on this field, stay fully active.
SecRule REQUEST_FILENAME "@streq /contact.php" \
    "id:1001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:message"

# G4: the Authelia portal sends the password as JSON. Same reason as rule 1000: it is only ever checked
# against a hash, never put into SQL or HTML.
SecRule REQUEST_FILENAME "@streq /api/firstfactor" \
    "id:1002,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# G4: Authelia's own script files, e.g. /static/js/hooks.PasswordVisibility.BkfT-6fZ.js, contain ".Pass", which
# is on CRS rule 930130's list of restricted file names (meant for files like .passwd). Skip only that rule,
# only for plain .js file names under /static/js/ (no "/" allowed, so no path tricks).
SecRule REQUEST_FILENAME "@rx ^/static/js/[A-Za-z0-9._-]+\.js$" \
    "id:1003,phase:1,pass,nolog,\
    ctl:ruleRemoveById=930130"

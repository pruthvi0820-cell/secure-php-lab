<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Too many requests</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #1d2330; margin: 0; }
  main { max-width: 560px; margin: 12vh auto; padding: 32px; background: #fff; border-radius: 12px;
         border-top: 6px solid #c77700; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { margin-top: 0; font-size: 1.5rem; }
  .meta { color: #5b6475; font-size: .9rem; border-top: 1px solid #e3e6eb; padding-top: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Slow down, please</h1>
  <p>Too many requests came from your address in a short time, so the security gateway is
     pausing you. Wait one minute and try again.</p>
  <p class="meta">Error 429 &middot; <!--# config timefmt="%d %b %Y, %H:%M:%S UTC" --><!--# echo var="date_gmt" --></p>
</main>
</body>
</html>

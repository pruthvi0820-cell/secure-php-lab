# G1: nginx is the only door into the app. PHP (the "web" container) is not published to the host.
server {
    listen 80;
    server_name localhost;
    server_tokens off;                     # hide the nginx version
    client_max_body_size 2m;               # reject huge uploads before they reach PHP

    access_log /var/log/nginx/gateway-access.log combined;
    error_log  /var/log/nginx/gateway-error.log warn;

    # Never serve hidden files (.env, .git, .htaccess) even if one ends up in the web root
    location ~ /\. {
        return 404;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;    # overwrites anything the visitor sent
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}